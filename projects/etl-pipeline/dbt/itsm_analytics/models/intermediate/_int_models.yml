version: 2

models:
  - name: int_helpdesk_tickets_enriched
    description: Helpdesk tickets with requester/assignee names and derived resolution time.
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null

  - name: int_incidents_enriched
    description: Incidents with asset/client/technician context and derived resolution time.
    columns:
      - name: incident_id
        data_tests:
          - unique
          - not_null

  - name: int_timesheet_entries_enriched
    description: Timesheet entries with project/client/employee context.
    columns:
      - name: timesheet_id
        data_tests:
          - unique
          - not_null

  - name: int_project_financials
    description: >
      One row per project — hours (from timesheets) and invoiced amount
      (from invoices) rolled up and reconciled at project grain, the only
      level these two sub-domains share a key at (see model SQL comment).
    columns:
      - name: project_id
        data_tests:
          - unique
          - not_null
