version: 2

models:
  - name: dim_date
    description: >
      Date spine, 2023-01-01 through 2026-12-31. Every fact-to-dim
      relationships test built in Chunk E depends on date_day being unique —
      that was never actually enforced until now.
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: dim_client
    description: >
      Conformed client dimension. Natural key used directly (CLI-#### is
      already clean and unique) — no surrogate key hashing.
    columns:
      - name: client_id
        data_tests:
          - unique
          - not_null

  - name: dim_staff
    description: >
      Conformed staff dimension — all 940 staff in one table, technicians,
      project managers, account managers, and plain employees alike, not
      split into separate dimensions (they all come from one raw.staff
      table with no structural difference beyond the role column). Every
      fact that references staff joins here via role-playing aliases
      depending on context (assigned_technician_id, project_manager_id,
      employee_id, requested_by_employee_id all point to this one table).
    columns:
      - name: staff_id
        data_tests:
          - unique
          - not_null
      - name: is_technician
        description: >
          True for the 40-person cross-domain pool that gets assigned to
          actual work (technicians, PMs, AMs); false for the 900 plain
          Employee-role staff, who only ever appear as helpdesk requesters.

  - name: dim_asset
    description: Conformed asset dimension.
    columns:
      - name: asset_id
        data_tests:
          - unique
          - not_null
      - name: client_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_client')
              field: client_id

  - name: dim_project
    description: Conformed project dimension.
    columns:
      - name: project_id
        data_tests:
          - unique
          - not_null
      - name: client_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_client')
              field: client_id
      - name: project_manager_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_staff')
              field: staff_id
