version: 2

models:
  - name: fct_helpdesk_ticket
    description: >
      One row per helpdesk ticket — FKs to dim_date (created/resolved),
      dim_staff (requester/assignee, role-playing), and resolution measures.
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null
      - name: created_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: resolved_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: requested_by_employee_id
        data_tests:
          - relationships:
              to: ref('dim_staff')
              field: staff_id
      - name: assigned_technician_id
        data_tests:
          - relationships:
              to: ref('dim_staff')
              field: staff_id

  - name: fct_incident
    description: >
      One row per incident — FKs to dim_date (opened/closed), dim_asset,
      dim_client, dim_staff (technician), and resolution measures.
    columns:
      - name: incident_id
        data_tests:
          - unique
          - not_null
      - name: opened_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: closed_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: asset_id
        data_tests:
          - relationships:
              to: ref('dim_asset')
              field: asset_id
      - name: client_id
        data_tests:
          - relationships:
              to: ref('dim_client')
              field: client_id
      - name: assigned_technician_id
        data_tests:
          - relationships:
              to: ref('dim_staff')
              field: staff_id

  - name: fct_timesheet_entry
    description: >
      One row per timesheet entry — FKs to dim_date (work_date), dim_project,
      dim_staff (employee). No row-level link to invoices (see
      int_project_financials for the project-grain reconciliation).
    columns:
      - name: timesheet_id
        data_tests:
          - unique
          - not_null
      - name: work_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: project_id
        data_tests:
          - relationships:
              to: ref('dim_project')
              field: project_id
      - name: employee_id
        data_tests:
          - relationships:
              to: ref('dim_staff')
              field: staff_id

  - name: fct_invoice
    description: >
      One row per invoice — FKs to dim_date (invoice_date), dim_project,
      dim_client.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: invoice_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: project_id
        data_tests:
          - relationships:
              to: ref('dim_project')
              field: project_id
      - name: client_id
        data_tests:
          - relationships:
              to: ref('dim_client')
              field: client_id
