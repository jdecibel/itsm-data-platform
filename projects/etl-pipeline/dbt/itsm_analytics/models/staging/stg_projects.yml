version: 2

models:
  - name: stg_projects
    description: 1:1 cleanup of raw.projects.
    columns:
      - name: project_id
        data_tests:
          - unique
          - not_null
      - name: client_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_clients')
              field: client_id
      - name: project_manager_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_staff')
              field: staff_id
      - name: contract_type
        data_tests:
          - accepted_values:
              values: ['Fixed-Bid', 'Time-and-Materials']
      - name: project_status
        data_tests:
          - accepted_values:
              values: ['Planned', 'Active', 'Completed', 'On Hold']
